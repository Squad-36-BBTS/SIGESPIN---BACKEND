spring.application.name=sigespin
# O Render informa a porta pela variável PORT; localmente continua 8080.
server.port=${PORT:8080}

# ----------------------------------------
# 1. Configuração do Banco de Dados (PostgreSQL)
# ----------------------------------------
# Em produção (Render + Supabase), DB_URL, DB_USERNAME e DB_PASSWORD vêm SEMPRE de variáveis de ambiente.
# Os valores depois de ":" servem só para o PostgreSQL local de desenvolvimento e não são segredos.
# Supabase: use a URL do "Session pooler" (IPv4) com ?sslmode=require no final.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sigespin}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
# O plano gratuito do Supabase limita conexões; poucas conexões bastam para o volume do projeto.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# ----------------------------------------
# 2. Configuração do Hibernate (JPA)
# ----------------------------------------
# Aqui dizemos ao Hibernate: "Não crie as tabelas. Apenas valide se as minhas classes
# Java (Entidades) combinam perfeitamente com o banco de dados já existente."
spring.jpa.hibernate.ddl-auto=validate
# Desligado por padrão para não poluir os logs de produção; ative localmente com JPA_SHOW_SQL=true.
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
# A sessão do banco fecha ao fim da transação do service: nada de consulta escondida durante a serialização.
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ----------------------------------------
# 3. Configuração do Flyway
# ----------------------------------------
# Ativa o Flyway para rodar os scripts SQL na pasta db/migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ----------------------------------------
# 4. Autenticação e segurança
# ----------------------------------------
# Defina JWT_SECRET como uma chave aleatória com pelo menos 32 bytes; não versionar o segredo.
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.issuer=${JWT_ISSUER:sigespin}
app.security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,https://sigespin-frontend.vercel.app}

# Integração Gemini (IA). A chave NUNCA vai no Git: defina GEMINI_API_KEY no ambiente ou no arquivo local.
app.ia.gemini.api-key=${GEMINI_API_KEY:}
app.ia.gemini.model=${GEMINI_MODEL:gemini-3.1-flash-lite}
app.ia.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
app.ia.gemini.timeout-ms=${GEMINI_TIMEOUT_MS:4000}

# Comprovantes privados. O limite se aplica a cada arquivo.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
app.arquivos.tipo=${ARQUIVOS_TIPO:LOCAL}
app.arquivos.diretorio=${ARQUIVOS_DIRETORIO:${user.home}/.sigespin/arquivos}
app.arquivos.s3.bucket=${ARQUIVOS_S3_BUCKET:}
app.arquivos.s3.region=${AWS_REGION:us-east-1}
# Vazio = AWS S3. Para o Supabase Storage: https://<project-ref>.storage.supabase.co/storage/v1/s3
app.arquivos.s3.endpoint=${ARQUIVOS_S3_ENDPOINT:}
# O Supabase Storage exige endereçamento por caminho (path-style).
app.arquivos.s3.path-style=${ARQUIVOS_S3_PATH_STYLE:false}
# As chaves S3 vêm de AWS_ACCESS_KEY_ID e AWS_SECRET_ACCESS_KEY (somente no servidor, nunca no Git).
app.ia.limite-usuario-minuto=${IA_LIMITE_USUARIO_MINUTO:10}
app.ia.limite-global-minuto=${IA_LIMITE_GLOBAL_MINUTO:60}

# ----------------------------------------
# 5. Verificação de saúde (Render)
# ----------------------------------------
# Expõe apenas /actuator/health, sem detalhes internos.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Documentação da API: /swagger-ui.html e /v3/api-docs
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.default-produces-media-type=application/json

# Cada linha de log leva o id da requisição (cabeçalho X-Request-Id)
logging.pattern.level=%5p [%X{requestId:-}]
