spring.application.name=sigespin

# ----------------------------------------
# 1. Configuração do Banco de Dados (PostgreSQL)
# ----------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/sigespin
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ----------------------------------------
# 2. Configuração do Hibernate (JPA)
# ----------------------------------------
# Aqui dizemos ao Hibernate: "Não crie as tabelas. Apenas valide se as minhas classes
# Java (Entidades) combinam perfeitamente com o banco de dados já existente."
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ----------------------------------------
# 3. Configuração do Flyway
# ----------------------------------------
# Ativa o Flyway para rodar os scripts SQL na pasta db/migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ----------------------------------------
# 4. Autenticação e segurança
# ----------------------------------------
# Defina JWT_SECRET como uma chave aleatória com pelo menos 32 bytes; não versionar o segredo.
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.issuer=${JWT_ISSUER:sigespin}
app.security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
